name: Android Release (Play internal)

on:
  push:
    tags: ['v*']           # 예: v1.0.0 태그를 push하면 릴리스
  workflow_dispatch:
    inputs:
      versionName:
        description: 'versionName (예: 1.0.1)'
        required: true

jobs:
  release:
    name: Signed AAB → Play internal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve versionName
        id: version
        run: |
          if [ -n "${{ github.event.inputs.versionName }}" ]; then
            echo "name=${{ github.event.inputs.versionName }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Host unit tests
        run: ./gradlew :core:jvmTest :shared:jvmTest

      - name: Decode upload keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}      # Play용 단조 증가 코드
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew :androidApp:bundleRelease

      - name: Upload to Play internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: today.superb.jvl
          releaseFiles: androidApp/build/outputs/bundle/release/androidApp-release.aab
          track: internal
          status: completed

      - name: Archive AAB
        uses: actions/upload-artifact@v4
        with:
          name: jvolution-release-aab
          path: androidApp/build/outputs/bundle/release/androidApp-release.aab
          if-no-files-found: error
